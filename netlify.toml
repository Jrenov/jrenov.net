[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Fonctions serverless (authentification GitHub du CMS Sveltia)
[functions]
  directory = "netlify/functions"

# Authentification du CMS (Sveltia) via GitHub OAuth
[[redirects]]
  from = "/api/auth"
  to = "/.netlify/functions/auth"
  status = 200
[[redirects]]
  from = "/api/callback"
  to = "/.netlify/functions/callback"
  status = 200

# En-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Les pages HTML doivent être revalidées (contenu à jour après un build).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Les assets générés par Astro sont hachés → cache long immuable.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Images (logo, photos, téléversements CMS) : cache modéré (une photo peut être
# remplacée via le CMS en gardant le même nom).
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# La config du CMS doit toujours être fraîche (sinon les nouvelles collections
# n'apparaissent pas tant que le cache navigateur n'a pas expiré).
[[headers]]
  for = "/admin/config.yml"
  [headers.values]
    Cache-Control = "no-cache, max-age=0, must-revalidate"
